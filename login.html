<!-- login.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync - Login</title>
    <meta name="description" content="Login to your CineSync account">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1 onclick="window.location.href='index.html'">CineSync</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="watchlist.html">My List</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-container slide-up">
            <div class="auth-header">
                <h2>Welcome Back! 👋</h2>
                <p>Login to manage your watchlist</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" id="login-btn" class="auth-btn">
                    <span class="btn-text">Login</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Email: demo@cinesync.com</p>
                <p>Password: demo123</p>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html" class="auth-link">Sign up</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 CineSync - Student Project</p>
    </footer>

    <script type="module" src="js/login.js"></script>
</body>

</html>
