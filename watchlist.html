<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync - My Watchlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1 onclick="window.location.href='index.html'">CineSync</h1> <!-- Agregamos onclick -->
        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="watchlist.html" class="active">My List</a> <!-- Marcamos como activo -->
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>My Watchlist</h2>
            <button id="clear-watchlist-btn"
                style="padding: 0.5rem 1rem; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Clear
                All</button>
        </div>
        <div id="watchlist-container" class="movies-grid">
            <p class="loading">Loading your watchlist...</p>
        </div>
    </main>

    <footer>
        <p>© 2024 CineSync - Student Project</p>
    </footer>

    <script type="module" src="js/watchlist-page.js"></script>
</body>

</html>
