<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync - Your Movie Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap"

</head>

<body>
    <header>
        <h1 onclick="window.location.href='index.html'">CineSync</h1> <!-- Agregamos onclick -->
        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="watchlist.html">My List</a>
            <a href="login.html">Login</a>
        </nav>
        <div class="header-right">

    <main>
        <section id="trending-section">
            <h2>Trending This Week</h2>

                    <div class="spinner"></div>
                    <p class="loading">Loading amazing movies... 🎬</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 CineSync - Student Project</p>
    </footer>
